name: Docker Build & Push (ai-service)

on:
  push:
    branches: [main]
    paths:
      - 'data_ai/service/**'
      - 'data_ai/model/**'
      - 'data_ai/*.csv'
      - '.github/workflows/docker-deploy-ai.yml'

jobs:
  build-and-push:
    name: Build AI service image and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: data_ai/service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/relaive-ai-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/relaive-ai-service:sha-${{ github.sha }}
