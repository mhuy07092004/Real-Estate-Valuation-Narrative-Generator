name: Docker Build & Push (backend)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'data_ai/*.csv'
      - '.github/workflows/docker-deploy.yml'

jobs:
  # Gate: nothing is built or deployed unless the backend builds and every
  # unit test passes. This runs in the same workflow as the deploy (not as a
  # separate workflow) so `needs` can actually block it — the CI workflow
  # runs in parallel and cannot stop a deploy on its own.
  test:
    name: Backend tests (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # tsc needs @prisma/client's generated types to resolve before it can build.
      - run: npm run prisma:generate

      - run: npm run build

      - run: npm test

  build-and-push:
    name: Build backend image and push to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation — no stored key needed
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/relaive-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/relaive-backend:sha-${{ github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deployer@csit321-508209.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Deploys the exact image just built (the immutable sha- tag, not
      # :latest) so Cloud Run always runs precisely what this commit built —
      # no reliance on Cloud Run re-resolving a mutable tag on its own,
      # which it never does automatically.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy relaive-backend \
            --image=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/relaive-backend:sha-${{ github.sha }} \
            --region=australia-southeast1 \
            --project=csit321-508209 \
            --quiet
